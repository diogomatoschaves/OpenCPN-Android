name: Build OpenCPN APK

on:
  push:
    branches: [degoogle, main]
  pull_request:
    branches: [degoogle, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set version
        run: |
          echo "VERSION_NAME=1.${{ github.run_number }}.0" >> $GITHUB_ENV
          echo "VERSION_CODE=$((1000 + ${{ github.run_number }}))" >> $GITHUB_ENV

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Sign APK
        if: github.event_name != 'pull_request' && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          "$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/ | tail -1)/apksigner" sign \
            --ks keystore.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out opencpn-pelorusfleet.apk \
            "$UNSIGNED_APK"
          rm keystore.jks

      - name: Verify APK
        if: github.event_name != 'pull_request' && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "APK size: $(du -h opencpn-pelorusfleet.apk | cut -f1)"
          "$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/ | tail -1)/apksigner" verify opencpn-pelorusfleet.apk
          echo "APK verified successfully"

      - name: Upload APK to Headwind MDM
        if: github.event_name != 'pull_request' && env.HEADWIND_MDM_URL != ''
        env:
          HEADWIND_MDM_URL: ${{ secrets.HEADWIND_MDM_URL }}
          HEADWIND_MDM_USERNAME: ${{ secrets.HEADWIND_MDM_USERNAME }}
          HEADWIND_MDM_PASSWORD: ${{ secrets.HEADWIND_MDM_PASSWORD }}
        run: |
          set -e
          APK_PATH="opencpn-pelorusfleet.apk"

          # 1. Authenticate — session cookie auth with MD5-hashed password
          echo "Authenticating with Headwind MDM..."
          PASSWORD_HASH=$(echo -n "${HEADWIND_MDM_PASSWORD}" | md5sum | cut -d' ' -f1 | tr 'a-f' 'A-F')

          LOGIN_RESPONSE=$(curl -sf -c /tmp/mdm_cookies.txt \
            -X POST "${HEADWIND_MDM_URL}/rest/public/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"login\": \"${HEADWIND_MDM_USERNAME}\", \"password\": \"${PASSWORD_HASH}\"}")

          LOGIN_STATUS=$(echo "$LOGIN_RESPONSE" | jq -r '.status // empty')
          if [ "$LOGIN_STATUS" != "OK" ]; then
            echo "::error::Failed to authenticate with Headwind MDM"
            echo "Response: $LOGIN_RESPONSE"
            exit 1
          fi
          echo "Authenticated successfully"

          # 2. Upload APK file
          echo "Uploading APK (~300 MB, this may take a minute)..."
          UPLOAD_RESPONSE=$(curl -sf -b /tmp/mdm_cookies.txt \
            -X POST "${HEADWIND_MDM_URL}/rest/private/web-ui-files" \
            -F "file=@${APK_PATH}")

          SERVER_PATH=$(echo "$UPLOAD_RESPONSE" | jq -r '.data.serverPath // empty')
          APP_ID=$(echo "$UPLOAD_RESPONSE" | jq -r '.data.application.id // empty')
          if [ -z "$SERVER_PATH" ]; then
            echo "::error::Failed to upload APK"
            echo "Response: $UPLOAD_RESPONSE"
            exit 1
          fi
          echo "APK uploaded (serverPath: $SERVER_PATH, appId: $APP_ID)"

          # 3. Create new version for the existing application
          VERSION=$(echo "$UPLOAD_RESPONSE" | jq -r '.data.fileDetails.version // "unknown"')
          VERSION_CODE=$(echo "$UPLOAD_RESPONSE" | jq -r '.data.fileDetails.versionCode // 0')

          echo "Adding version ${VERSION} (code ${VERSION_CODE}) to app ${APP_ID}..."
          VERSION_RESPONSE=$(curl -sf -b /tmp/mdm_cookies.txt \
            -X PUT "${HEADWIND_MDM_URL}/rest/private/applications/versions" \
            -H "Content-Type: application/json" \
            -d "{
              \"applicationId\": ${APP_ID},
              \"version\": \"${VERSION}\",
              \"versionCode\": ${VERSION_CODE},
              \"filePath\": \"${SERVER_PATH}\"
            }")

          VERSION_STATUS=$(echo "$VERSION_RESPONSE" | jq -r '.status // empty')
          if [ "$VERSION_STATUS" != "OK" ]; then
            echo "::error::Failed to update application version"
            echo "Response: $VERSION_RESPONSE"
            exit 1
          fi

          VERSION_URL=$(echo "$VERSION_RESPONSE" | jq -r '.data.url // "unknown"')
          echo "Application updated: ${VERSION_URL}"

      - name: Upload unsigned APK
        if: env.KEYSTORE_BASE64 == '' || github.event_name == 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: opencpn-unsigned
          path: app/build/outputs/apk/release/*.apk

      - name: Upload signed APK as artifact
        if: github.event_name != 'pull_request' && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: opencpn-pelorusfleet-${{ github.sha }}
          path: opencpn-pelorusfleet.apk
          retention-days: 30

      - name: Deployment Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "# OpenCPN APK Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Package | \`org.opencpn.opencpn\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ env.VERSION_NAME }}\` (code \`${{ env.VERSION_CODE }}\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| Charts | Mediterranean CM93 (2015) |" >> $GITHUB_STEP_SUMMARY
          if [ -f opencpn-pelorusfleet.apk ]; then
            echo "| APK Size | $(du -h opencpn-pelorusfleet.apk | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| MDM | Uploaded to Headwind MDM |" >> $GITHUB_STEP_SUMMARY
